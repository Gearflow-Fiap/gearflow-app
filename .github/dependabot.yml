version: 2
updates:
  # NuGet — Central Package Management: as versões vivem em Directory.Packages.props
  # (raiz), então o Dependabot opera no diretório "/".
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [ "dependencies", "nuget" ]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Agrupa atualizações de patch/minor num PR só para reduzir ruído.
      nuget-minor-patch:
        update-types: [ "minor", "patch" ]

  # Mantém as actions dos workflows atualizadas e fixadas.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [ "dependencies", "github-actions" ]
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Um PR só com todas as atualizações de actions (reduz ruído).
      github-actions:
        patterns: [ "*" ]
