name: Docker Publish

# Publica as imagens no GHCR. Não roda em PR (só valida no ci.yml); publica em
# push para main/develop e em tags de release (v*). O deploy em si vive nos
# repos de infra (gearflow-infra-k8s / gearflow-infra-db) — ver docs/development/CI.md.
on:
  push:
    branches: [ main, develop ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push para ghcr.io usando o GITHUB_TOKEN nativo

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gearflow-api
            dockerfile: src/Host/GearFlow.Api/Dockerfile
          - image: gearflow-gateway
            dockerfile: src/Gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
