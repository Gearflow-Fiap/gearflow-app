name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-unit:
    name: Build + Unit + Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore GearFlow.slnx

      - name: Build (Release)
        run: dotnet build GearFlow.slnx -c Release --no-restore

      - name: Unit + Architecture tests
        run: >
          dotnet test GearFlow.slnx -c Release --no-build
          --filter "FullyQualifiedName!~IntegrationTests"
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage-unit

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: ./coverage-unit/**/coverage.cobertura.xml
          if-no-files-found: ignore

  integration:
    name: Integration (Testcontainers / SQL Server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore GearFlow.slnx

      - name: Integration tests
        run: >
          dotnet test GearFlow.slnx -c Release
          --filter "FullyQualifiedName~IntegrationTests"
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage-integration
          --blame-hang-timeout 10m

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: ./coverage-integration/**/coverage.cobertura.xml
          if-no-files-found: ignore

  coverage:
    name: Coverage (merge + ratchet)
    runs-on: ubuntu-latest
    needs: [ build-and-unit, integration ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./coverage-all

      - name: Merge + report
        run: >
          dotnet tool run reportgenerator
          -reports:"./coverage-all/**/coverage.cobertura.xml"
          -targetdir:"./coverage-report"
          -reporttypes:"Cobertura;TextSummary;MarkdownSummaryGithub"

      - name: Coverage summary
        run: cat ./coverage-report/Summary.txt || true
      # TODO(ratchet): comparar com docs/coverage/coverage-baseline.txt (tolerância 0.5pp),
      # barrar PR abaixo do baseline e, em push para main, subir o baseline + publicar badge.
